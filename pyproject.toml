[tool.poetry]
name = "inforce-test-task-2"
version = "0.1.0"
description = ""
authors = ["Little-Wretch <nazarr914@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.6"
djangorestframework = "^3.15.2"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.10"
redis = "^5.2.1"
django-redis = "^5.4.0"
django-cors-headers = "^4.7.0"
celery = {extras = ["redis"], version = "^5.4.0"}
pre-commit = "^4.1.0"
factory-boy = "^3.3.3"
djangorestframework-simplejwt = "^5.4.0"
drf-yasg = "^1.21.8"


[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
bandit = "^1.7.10"
commitizen = "^3.29.1"
coverage = "^7.6.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true


[tool.ruff]
line-length = 120
fix = true


[tool.coverage.run]
branch = true
omit = [
    "*/__init__.py",
    "*/tests.py",
    "*/migrations/*",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
    "manage.py",
    "*_base.py",
    "test_*.py",
]
source = ["."]


[tool.coverage.report]
show_missing = true
